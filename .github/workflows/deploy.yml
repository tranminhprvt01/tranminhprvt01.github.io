name: Deploy to GitHub Pages

on:
  # Kích hoạt workflow mỗi khi bạn push code lên nhánh `main`
  push:
    branches: [main]
  # Cho phép bạn chạy workflow này thủ công từ tab Actions trên GitHub
  workflow_dispatch:

# Cấp quyền cho job này để clone repo và tạo một deployment trang
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Job này chỉ có MỘT nhiệm vụ: Build và Deploy
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      # Action này sẽ tự động:
      # 1. Cài đặt Node.js và pnpm
      # 2. Cài đặt dependencies (pnpm install)
      # 3. Build trang Astro (pnpm run build)
      # 4. Chuẩn bị artifact để deploy
      - name: Build with Astro
        uses: withastro/action@v2
        with:
          package-manager: pnpm

      # Action này sẽ lấy artifact đã được tạo ở bước trên và deploy nó
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4